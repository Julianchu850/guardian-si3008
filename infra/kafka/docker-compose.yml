# Etapa 2 — Kafka en modo KRaft (sin ZooKeeper) + consumidor a S3 bronce.
#
#   docker compose up -d                       # Kafka, tópicos, UI y bronze-sink
#   docker compose --profile sim run --rm simulator --players 200 --days 2
#
# Dos listeners:
#   INTERNAL  kafka:29092                      para los contenedores de esta red
#   EXTERNAL  ${KAFKA_ADVERTISED_HOST}:9092    para clientes fuera de Docker (tu portátil)

name: guardian

services:
  kafka:
    image: apache/kafka:3.9.1
    container_name: kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://${KAFKA_ADVERTISED_HOST:-localhost}:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 168          # 7 días en Kafka; el histórico vive en S3
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx1g"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  # Crea los tópicos una vez y termina. La clave de los mensajes es player_id,
  # así que las particiones permiten paralelizar sin perder el orden por jugador.
  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        T=/opt/kafka/bin/kafka-topics.sh
        $$T --bootstrap-server kafka:29092 --create --if-not-exists --topic game-events   --partitions 6 --replication-factor 1
        $$T --bootstrap-server kafka:29092 --create --if-not-exists --topic ad-events     --partitions 3 --replication-factor 1
        $$T --bootstrap-server kafka:29092 --create --if-not-exists --topic interventions --partitions 3 --replication-factor 1
        $$T --bootstrap-server kafka:29092 --describe
    restart: "no"

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: kafka-ui
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: guardian
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  # Consumidor Kafka → S3 bronce (o carpeta local si BRONZE_URI es una ruta).
  # Usa las credenciales del rol de la EC2 (LabInstanceProfile).
  bronze-sink:
    build: ../../ingestion
    container_name: bronze-sink
    restart: unless-stopped
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      KAFKA_GROUP: bronze-sink
      TOPICS: game-events,ad-events
      BRONZE_URI: ${BRONZE_URI:-/data/lake}
      FLUSH_MAX_RECORDS: ${FLUSH_MAX_RECORDS:-5000}
      FLUSH_MAX_SECONDS: ${FLUSH_MAX_SECONDS:-60}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
    volumes:
      - ./lake:/data/lake          # solo se usa en modo local

  # Productor: el simulador de la etapa 1 publicando en Kafka.
  simulator:
    build: ../../simulator
    profiles: ["sim"]
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    # Dimensiones y verdad terreno quedan en GUARDIAN_DATA para que Airflow las suba (etapa 3)
    volumes:
      - ${GUARDIAN_DATA:-/home/ec2-user/guardian-data}/sim:/out
    command: ["--sink", "kafka", "--bootstrap", "kafka:29092", "--out", "/out/stream-split-s42",
              "--players", "200", "--days", "2", "--speed", "3600", "--policy", "split"]

volumes:
  kafka-data:
